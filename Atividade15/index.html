<!DOCTYPE html>
<html lang="en">
<head>
    <script src="script.js"></script>
    <link rel="stylesheet" href="arquivo.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="form-container">
        <h2>Formulário Principal</h2>
        <hr>

        <form name="meuFormulario" onsubmit="return validar(event)">
            
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email">
            </div>

            <div class="form-group">
                <label for="comentario">Comentário:</label>
                <textarea name="comentario" id="comentario"></textarea>
            </div>

            <div class="pesquisa-section">
                <p>Pesquisa:</p>
                <p class="pergunta">Primeira vez nesta página??</p>
                
                <input type="radio" name="pesquisa" id="sim" value="sim">
                <label for="sim">Sim</label>
                
                <input type="radio" name="pesquisa" id="nao" value="nao">
                <label for="nao">Não</label>
            </div>

            <div class="botoes">
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </div>

        </form>
    </div>
</body>
</html>
