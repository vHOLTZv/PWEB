<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atividade 14 - Transformar Texto</title>
    <script src="arquivo.js"></script>
</head>
<body>

    <h2>Exercício - Maiúsculas e Minúsculas</h2>
    
    <form id="formTexto">
        <label for="textoInput">Digite um texto: </label>
        <input type="text" id="textoInput" size="50" placeholder="Digite algo aqui...">
        
        <br><br>
        
        <input type="radio" id="btnMaiuscula" name="opcaoTexto">
        <label for="btnMaiuscula">1º RadioButton - MAIÚSCULAS</label>
        
        <br><br>
        
        <input type="radio" id="btnMinuscula" name="opcaoTexto">
        <label for="btnMinuscula">2º RadioButton - minúsculas</label>
    </form>

</body>
</html>
